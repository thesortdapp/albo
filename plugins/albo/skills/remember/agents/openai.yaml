interface:
  display_name: "Remember in Albo"
  short_description: "Save decisions and facts to your Albo brain"
  default_prompt: "Use $remember to save this decision to my Albo brain."
dependencies:
  tools:
    - type: "mcp"
      value: "albo"
      description: "Albo personal library and brain"
      transport: "streamable_http"
      url: "https://mcp.albo.inc/mcp"
policy:
  allow_implicit_invocation: true
