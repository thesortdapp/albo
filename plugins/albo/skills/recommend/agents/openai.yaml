interface:
  display_name: "Recommend from Albo"
  short_description: "New picks from what you've finished and rated"
  default_prompt: "Use $recommend to suggest something new based on what I've watched and how I rated it."
dependencies:
  tools:
    - type: "mcp"
      value: "albo"
      description: "Albo personal library"
      transport: "streamable_http"
      url: "https://mcp.albo.inc/mcp"
policy:
  allow_implicit_invocation: true
