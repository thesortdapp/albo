interface:
  display_name: "Save to Albo"
  short_description: "Save links and documents into Albo"
  default_prompt: "Use $save to save this into my Albo library."
dependencies:
  tools:
    - type: "mcp"
      value: "albo"
      description: "Albo personal library"
      transport: "streamable_http"
      url: "https://mcp.albo.inc/mcp"
policy:
  allow_implicit_invocation: true
