interface:
  display_name: "Think with Albo"
  short_description: "Cited answers across many brain pages"
  default_prompt: "Use $think to work out what my Albo brain says about this."
dependencies:
  tools:
    - type: "mcp"
      value: "albo"
      description: "Albo personal library and brain"
      transport: "streamable_http"
      url: "https://mcp.albo.inc/mcp"
policy:
  allow_implicit_invocation: true
